name: CI
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    name: ci gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
      - uses: Automancer-Ltd/estate-checks@dc1864014e2a459f97d16ddd6aa7b884551d8c8e # v1.9.0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        env:
          npm_config_audit: "false"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"
      # Hash-locked: pip refuses any file not listed in scripts/requirements.txt, so a file
      # swapped or added on PyPI never runs in the job that builds the published site.
      - name: Install preview-card compression
        run: python3 -m pip install --require-hashes --only-binary=:all: -r scripts/requirements.txt
      - name: Find the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore the pnpm store
        id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-node26-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-node26-
      - run: pnpm install --frozen-lockfile
      # Saved straight after install, so a later failing check never loses the cache.
      - name: Save the pnpm store
        if: steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-node26-${{ hashFiles('pnpm-lock.yaml') }}
      # Kept share cards from main's Pages builds (scripts/og-cards.mjs), so the shared
      # test build and the final build copy unchanged cards instead of starting Chrome.
      - name: Restore kept share cards
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/share-cards
          key: share-cards-${{ github.sha }}
          restore-keys: share-cards-
      - name: Quick lint, typecheck and privacy scan
        run: pnpm check
      - run: pnpm test
      - name: Build and check the rendered site
        run: pnpm build && node scripts/site-check.mjs
        env:
          SITE_REVISION: ${{ github.sha }}
