name: Build & deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    name: Build and check the site
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        env:
          npm_config_audit: "false"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"
      # Hash-locked: pip refuses any file not listed in scripts/requirements.txt, so a file
      # swapped or added on PyPI never runs in the job that builds the published site.
      - name: Install preview-card compression
        run: 'python3 -m pip install --require-hashes --only-binary=:all: -r scripts/requirements.txt'
      - run: pnpm install --frozen-lockfile
      # Share cards kept from earlier main builds, keyed by everything that decides their
      # pixels (scripts/og-cards.mjs). A release with unchanged cards then never starts
      # Chrome, which costs about 18 s on a fresh runner. Saved again after a good build.
      - name: Restore and keep share cards
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/share-cards
          key: share-cards-${{ github.sha }}
          restore-keys: share-cards-
      - name: Privacy guard on the source being published
        run: node scripts/content-guard.mjs
      # This build is consumed by Pages, rather than repeating the PR test suite.
      - name: Build the production artifact and validate its contracts
        run: pnpm build && node scripts/site-check.mjs
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SITE_REVISION: ${{ github.sha }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          retention-days: 1
          # Publishes .well-known/security.txt. site-check has already refused any file
          # outside the public inventory, so no other dot-file can reach the upload.
          include-hidden-files: true

  # Keep publishing credentials out of the runner that installs dependencies and builds the site.
  deploy:
    name: Publish the checked site
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Verify production serves this revision
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            [ "$(curl -fsS --max-time 10 "https://waseemilyas.uk/revision.txt?cb=$i-$(date +%s)")" = "$GITHUB_SHA" ] && exit 0
            sleep 3
          done
          echo "production does not serve $GITHUB_SHA" >&2
          exit 1

  # CAA, certificate, DNSSEC, HTTPS redirect and record, and error-report origins on the live domain; also runs daily.
  domain:
    name: Check the live domain
    needs: deploy
    permissions:
      contents: read
    uses: ./.github/workflows/domain.yml
