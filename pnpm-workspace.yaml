# Quarantine newly published packages for one day: a package released in the
# last 24 hours is refused, which is the window in which a compromised release
# is normally caught and pulled. Exact-version exceptions go in
# minimumReleaseAgeExclude below, after an audit.
# Strict is set explicitly rather than left to pnpm's default. pnpm 11 and later
# turn it on by default once minimumReleaseAge is set, but a setting the estate depends
# on should say so in the file rather than rely on a default that can change.
# Strict means: in CI, or any non-interactive run, an immature package is a hard
# error instead of a prompt. Must live here, not in .npmrc — pnpm 11 and later
# ignore these keys there. Because package.json pins pnpm 12, a misspelt key in
# this file stops every install (ERR_PNPM_UNRECOGNIZED_WORKSPACE_SETTINGS)
# instead of silently dropping the policy it was meant to set.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
