overrides:
  # Remove once @11ty/eleventy declares @11ty/recursive-copy: ^5.
  '@11ty/recursive-copy': ^5.0.2
  # GHSA-g3hv-75wg-m249: recursive-copy only uses the retained minimatch.match API.
  # Remove once recursive-copy requires minimatch >=11.0.1.
  '@11ty/recursive-copy>minimatch': ^11.0.3
  # Build-time advisories in Eleventy's transitive tree (GHSA-5p4m-2wfm-xmqj,
  # GHSA-rgw5-rvv9-x895). Nothing here ships to the browser, but the patched
  # versions are drop-in, so we take them. Remove once Eleventy ships them itself.
  'js-yaml@^3': ^3.15.2
  'js-yaml@^4': ^4.3.2
  'brace-expansion@^5': ^5.0.9
  # markdown-it quadratic-time parsing (GHSA-gfr2-rv44-r23c, GHSA-vfgh-jcmw-g37q),
  # build-time only via Eleventy. Remove once Eleventy requires >= 14.3.3.
  'markdown-it@^14': ^14.3.3
  # braces (GHSA-vfj7-8cjw-p6xm, deep-nesting stack exhaustion, <= 3.0.3) has no
  # patched release; 3.0.3 is still npm latest (checked 2026-10-13). Build-time
  # only via chokidar. Nothing to pin: bump when a release > 3.0.3 appears.
# Quarantine newly published packages for one day: a package released in the
# last 24 hours is refused, which is the window in which a compromised release
# is normally caught and pulled. Exact-version exceptions go in
# minimumReleaseAgeExclude below, after an audit.
# Strict is set explicitly rather than left to pnpm's default. pnpm 11 turns it
# on by default once minimumReleaseAge is set, but a setting the estate depends
# on should say so in the file rather than rely on a default that can change.
# Strict means: in CI, or any non-interactive run, an immature package is a hard
# error instead of a prompt. Must live here, not in .npmrc — pnpm 11 ignores
# these keys there.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
